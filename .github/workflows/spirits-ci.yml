name: Spirits CI

on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - packages/spirits/**
      - scripts/build-binaries.ts
      - scripts/replace-pi-version.ts
      - scripts/install.sh
      - scripts/install.test.sh
      - .github/workflows/spirits-ci.yml
  pull_request:
    branches: [main]
    paths:
      - bun.lock
      - packages/spirits/**
      - scripts/build-binaries.ts
      - scripts/replace-pi-version.ts
      - scripts/install.sh
      - scripts/install.test.sh
      - .github/workflows/spirits-ci.yml

concurrency:
  group: spirits-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Test and type-check spirits
        run: |
          set -euo pipefail
          cd packages/spirits
          bun install --frozen-lockfile
          bun test
          bun run check

      - name: Check installer syntax
        run: sh -n scripts/install.sh

      - name: Test installer
        run: sh scripts/install.test.sh
