name: Spirits CI

on:
  push:
    branches: [main]
    paths:
      - packages/spirits/**
      - scripts/**
      - docs/architecture/**
      - bun.lock
      - package.json
      - biome.json
      - tsconfig.json
      - tsconfig.base.json
      - tsconfig.scripts.json
      - .husky/**
      - .github/workflows/spirits-ci.yml
      - .github/workflows/spirits-release.yml
  pull_request:
    branches: [main]
    paths:
      - packages/spirits/**
      - scripts/**
      - docs/architecture/**
      - bun.lock
      - package.json
      - biome.json
      - tsconfig.json
      - tsconfig.base.json
      - tsconfig.scripts.json
      - .husky/**
      - .github/workflows/spirits-ci.yml
      - .github/workflows/spirits-release.yml

concurrency:
  group: spirits-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # One workspace, one lockfile: the root install brings the pinned host packages with it.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The host comes from the packages pinned in packages/spirits, so nothing here builds or
      # hydrates Pi: the type check and the tests read the published host types and the real host.
      - name: Check the repository
        run: bun run check

      - name: Test spirits
        run: |
          set -euo pipefail
          cd packages/spirits
          bun test

      # The launcher is the only artifact this build produces, and the theme assets are read from
      # scripts/compat-theme rather than a Pi source tree.
      - name: Build the launcher
        run: |
          set -euo pipefail
          bun scripts/build-binaries.ts --version 0.0.0-ci
          test -x dist/spirits-linux-x64
          dist/spirits-linux-x64 --version
          cmp scripts/compat-theme/dark.json dist/theme/dark.json
          cmp scripts/compat-theme/light.json dist/theme/light.json
          (cd dist/theme && sha256sum -c dark.json.sha256 && sha256sum -c light.json.sha256)

      - name: Check installer syntax
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          sh -n scripts/self-update-smoke.sh

      - name: Test installer
        run: sh scripts/install.test.sh
